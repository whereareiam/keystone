[versions]

# general
lombok = "1.18.42"
jetbrains-annotations = "26.0.2"
junit = "6.0.1"
mockito = "5.24.0"

# libraries
adventure = "5.2.0"
# the Adventure of the Paper API Keystone compiles against, which its tests run on
adventure-paper = "4.26.1"
semantica = "dev-3ec129d"
configura = "2.1.0"

# platforms
spigot = "1.21.11-R0.1-SNAPSHOT"
paper = "1.21.11-R0.1-SNAPSHOT"
velocity = "3.5.1"
bungeecord = "1.21-R0.4"
adventure-platform = "4.4.1"

# integrations
placeholderapi = "2.12.3"
papiproxybridge = "1.8.4"
# 3.2 needs Java 25.
miniplaceholders = "3.1.0"
# Intercept's API from whereareiam/Intercept#14, built into mavenLocal until it is published.
intercept = "dev"

[libraries]

# general
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }

# adventure
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { group = "net.kyori", name = "adventure-text-serializer-plain", version.ref = "adventure" }
adventure-platform-bukkit = { group = "net.kyori", name = "adventure-platform-bukkit", version.ref = "adventure-platform" }
adventure-platform-bungeecord = { group = "net.kyori", name = "adventure-platform-bungeecord", version.ref = "adventure-platform" }

# semantica
semantica-api = { group = "me.whereareiam.semantica", name = "semantica-api", version.ref = "semantica" }
semantica-common = { group = "me.whereareiam.semantica", name = "semantica-common", version.ref = "semantica" }
semantica-syntax-icu = { group = "me.whereareiam.semantica", name = "syntax-icu", version.ref = "semantica" }
semantica-testing = { group = "me.whereareiam.semantica", name = "semantica-testing", version.ref = "semantica" }
semantica-format-adventure-common = { group = "me.whereareiam.semantica", name = "format-adventure-common", version.ref = "semantica" }
semantica-format-adventure-v4 = { group = "me.whereareiam.semantica", name = "format-adventure-v4", version.ref = "semantica" }
semantica-format-adventure-v5 = { group = "me.whereareiam.semantica", name = "format-adventure-v5", version.ref = "semantica" }

# configura
configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }

# platforms
spigot = { group = "org.spigotmc", name = "spigot-api", version.ref = "spigot" }
paper = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
bungeecord = { group = "net.md-5", name = "bungeecord-api", version.ref = "bungeecord" }

# integrations
placeholderapi = { group = "me.clip", name = "placeholderapi", version.ref = "placeholderapi" }
papiproxybridge = { group = "net.william278", name = "papiproxybridge", version.ref = "papiproxybridge" }
miniplaceholders = { group = "io.github.miniplaceholders", name = "miniplaceholders-api", version.ref = "miniplaceholders" }
intercept-api = { group = "me.whereareiam.intercept", name = "api", version.ref = "intercept" }

[bundles]
adventure = ["adventure-api", "adventure-minimessage"]
